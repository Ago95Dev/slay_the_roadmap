name: slay_the_roadmap
description: A gamified Dart learning application with deck-building mechanics inspired by Slay the Spire
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  equatable: ^2.0.5
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Utilities
  uuid: ^4.2.2
  intl: ^0.18.1
  url_launcher: ^6.3.1
  webview_flutter: ^4.4.22
  
  # Hub Gamification (F7)
  http: ^1.2.0
  
  # Icons
  cupertino_icons: ^1.0.6
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/backgrounds/
    - assets/images/bosses/
    - assets/images/cards/
